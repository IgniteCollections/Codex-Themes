name: CI

on:
  pull_request:
    branches: [main, pre-release]

permissions:
  contents: read

jobs:
  theme-app-build:
    name: Theme apps (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover theme apps
        id: apps
        run: |
          files=$(git ls-files '*/app/package.json' | jq -R -c -s 'split("\n")[:-1] | map(gsub("/package.json$"; ""))')
          echo "matrix=$files" >> "$GITHUB_OUTPUT"

      - name: Skip when no theme apps
        if: steps.apps.outputs.matrix == '[]'
        run: echo "No theme apps found; nothing to check."

      - name: Setup Node
        if: steps.apps.outputs.matrix != '[]'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint and build each theme app
        if: steps.apps.outputs.matrix != '[]'
        shell: bash
        run: |
          set -e
          for app in $(echo '${{ steps.apps.outputs.matrix }}' | jq -r '.[]'); do
            echo "=== Checking $app ==="
            npm --prefix "$app" ci
            npm --prefix "$app" run lint -- --max-warnings=0
            npm --prefix "$app" run build
          done

  skin-store:
    name: Skin Store (lint + build + rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend lint + build
        run: |
          npm --prefix Codex-Skin-Store ci
          npm --prefix Codex-Skin-Store run lint -- --max-warnings=0
          npm --prefix Codex-Skin-Store run build

      - name: Rust build + clippy
        run: |
          cargo build --manifest-path Codex-Skin-Store/src-tauri/Cargo.toml
          cargo clippy --manifest-path Codex-Skin-Store/src-tauri/Cargo.toml -- -D warnings

  data-sync:
    name: Generated data in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Re-run all generators and verify no drift
        run: |
          set -e
          python3 Pokemon/scripts/generate-themes.py
          python3 Pokemon/scripts/generate-desktop-themes.py
          python3 Pokemon/scripts/generate-terminal-schemes.py
          python3 Pokemon/scripts/generate-skins.py
          python3 Pokemon/scripts/generate-scene-art.py
          python3 Pokemon/scripts/generate-studio-themes.py
          python3 Pokemon/scripts/generate-mascot-art.py
          python3 Pokemon/scripts/check-data-sync.py
          if ! git diff --exit-code --quiet; then
            echo "::error::Generated artifacts are out of sync with scenes.ts. Re-run Pokemon/scripts/generate-*.py and commit."
            git diff --stat
            git diff
            exit 1
          fi
          echo "All generated artifacts are in sync."

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [theme-app-build, skin-store, data-sync]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          failed=$(echo "$results" | jq '[to_entries[] | select(.value.result != "success")] | length')
          if [ "$failed" -gt 0 ]; then
            echo "One or more required checks did not succeed."
            exit 1
          fi
          echo "All required checks passed."
