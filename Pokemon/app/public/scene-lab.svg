<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 18" shape-rendering="crispEdges">
  <rect width="32" height="18" fill="#0D1420"/>
  <!-- 墙面面板缝 -->
  <rect x="0" y="4" width="32" height="1" fill="#131E2E"/>
  <rect x="0" y="9" width="32" height="1" fill="#131E2E"/>
  <rect x="8" y="0" width="1" height="13" fill="#101A28"/>
  <rect x="24" y="0" width="1" height="13" fill="#101A28"/>
  <!-- 顶部灯带 -->
  <rect x="2" y="1" width="12" height="1" fill="#7BD3F0" opacity="0.25"/>
  <rect x="18" y="1" width="12" height="1" fill="#7BD3F0" opacity="0.25"/>
  <!-- 培养舱 1 -->
  <rect x="3" y="3" width="5" height="9" fill="#12283A"/>
  <rect x="4" y="4" width="3" height="7" fill="#1A4A5A"/>
  <rect x="4" y="4" width="3" height="1" fill="#2E7A8A"/>
  <rect x="5" y="6" width="1" height="1" fill="#7BD3F0"/>
  <rect x="5" y="8" width="1" height="1" fill="#9B7BF0"/>
  <!-- 培养舱 2（超梦的，紫光） -->
  <rect x="13" y="2" width="6" height="10" fill="#12283A"/>
  <rect x="14" y="3" width="4" height="8" fill="#2A2A5A"/>
  <rect x="14" y="3" width="4" height="1" fill="#4A4A8A"/>
  <rect x="15" y="5" width="2" height="1" fill="#9B7BF0"/>
  <rect x="15" y="7" width="1" height="1" fill="#B89BF8"/>
  <rect x="16" y="9" width="1" height="1" fill="#9B7BF0"/>
  <!-- 培养舱 3 -->
  <rect x="25" y="3" width="5" height="9" fill="#12283A"/>
  <rect x="26" y="4" width="3" height="7" fill="#1A4A5A"/>
  <rect x="26" y="4" width="3" height="1" fill="#2E7A8A"/>
  <rect x="27" y="6" width="1" height="1" fill="#7BD3F0"/>
  <rect x="27" y="9" width="1" height="1" fill="#7BD3F0" opacity="0.6"/>
  <!-- 管线 -->
  <rect x="3" y="12" width="27" height="1" fill="#1E3248"/>
  <rect x="8" y="12" width="1" height="1" fill="#F2788A" opacity="0.7"/>
  <rect x="16" y="12" width="1" height="1" fill="#9B7BF0"/>
  <rect x="23" y="12" width="1" height="1" fill="#7BD3F0" opacity="0.7"/>
  <!-- 地板 + 反光 -->
  <rect x="0" y="13" width="32" height="2" fill="#0A0F18"/>
  <rect x="0" y="15" width="32" height="3" fill="#060A12"/>
  <rect x="13" y="14" width="6" height="1" fill="#9B7BF0" opacity="0.18"/>
  <rect x="3" y="14" width="5" height="1" fill="#7BD3F0" opacity="0.12"/>
  <rect x="25" y="14" width="5" height="1" fill="#7BD3F0" opacity="0.12"/>
</svg>
